<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel agama</title>
    <style>
        /* Mengatur dasar tampilan halaman */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        /* Styling untuk tabel agama */
        #agamaTable {
            width: 45%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 20px;
            background-color: #ddd;
        }

        #agamaTable th, #agamaTable td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
            width: 100px;
        }
        #agamaTable td input {
            width: 100px;  /* Lebar input agar lebih kecil */
            padding: 4px;
            text-align: center;
        }

        #agamaTable th {
            background-color: #4CAF50;
            color: white;
        }

        #agamaTable tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #agamaTable tr:hover {
            background-color: #ddd;
        }
        #agamaTable tfoot td {
            text-align: center;  /* Centers the "TOTAL" text */
            font-weight: bold;  /* Optional: Make the "TOTAL" text bold */
        }
         /* Container for buttons to position them side by side with space */
        #buttonContainer {
            position: absolute;
            top: 400px;
            right: 20px;
            display: flex;
            gap: 20px; /* Space between buttons */
        }

        #saveBtn {
            margin: 400px auto;
            margin-right: 10px;
            top: 10px;
            right: 300px;
            padding: 10px 20px;
            background-color: #3da7f4;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: block; /* Center the button */
            width: 100px;
        }
        #saveBtn:hover {
            background-color: #080606;
        }
        #editBtn {
            margin: 400px auto;
            top: 10px;
            right: 300px;
            padding: 10px 20px;
            background-color: #3da7f4;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            width: 100px;
        }
        #editBtn:hover {
            background-color: #080606;
        }
        #saveNotification {
            position: absolute;
            top: 400px;
            right: 200px;
            padding: 10px;
            color: rgb(9, 10, 9);
            border-radius: 10px;
            display: none;
        }

        /* Style untuk chart */
        #chartContainer {
            width: 35%;
            margin-top: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #datetime {
    position: fixed; /* Menggunakan fixed agar tetap di tempat meskipun halaman digulir */
    top: 1px; /* Menentukan jarak dari atas */
    left: 5px; /* Menentukan jarak dari kiri */
    font-size: 14px;
    font-weight: bold;
    color: #333;
    z-index: 100; /* Agar berada di atas elemen lain */
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@0.7.0"></script>

</head>
<body>
    <div id="datetime" ></div>
     <div class="container" style="display: flex; justify-content: space-between;">
        <table id="occupationTable">
        <table id="agamaTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Agama</th>
                    <th>KK</th>
                    <th>L</th>
                    <th>P</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td>1</td>
                    <td>ISLAM</td>
                    <td><input type="number" class="kk" value="518" /></td>
                    <td><input type="number" class="l" value="865" /></td>
                    <td><input type="number" class="p" value="872" /></td>
                    <td><input type="number" class="total" value="1737" disabled /></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>KRISTEN PROTESTAN</td>
                    <td><input type="number" class="kk" value="13" /></td>
                    <td><input type="number" class="l" value="28" /></td>
                    <td><input type="number" class="p" value="13" /></td>
                    <td><input type="number" class="total" value="41" disabled /></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>KRISTEN KATOLIK</td>
                    <td><input type="number" class="kk" value="0" /></td>
                    <td><input type="number" class="l" value="0" /></td>
                    <td><input type="number" class="p" value="0" /></td>
                    <td><input type="number" class="total" value="0" disabled /></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>HINDU</td>
                    <td><input type="number" class="kk" value="0" /></td>
                    <td><input type="number" class="l" value="0" /></td>
                    <td><input type="number" class="p" value="0" /></td>
                    <td><input type="number" class="total" value="0" disabled /></td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>BUDHA</td>
                    <td><input type="number" class="kk" value="0" /></td>
                    <td><input type="number" class="l" value="0" /></td>
                    <td><input type="number" class="p" value="0" /></td>
                    <td><input type="number" class="total" value="0" disabled /></td>
                </tr>
                <tr>
                    <td>6</td>
                    <td>PENGANUT KEPERCAYAAN</td>
                    <td><input type="number" class="kk" value="0" /></td>
                    <td><input type="number" class="l" value="0" /></td>
                    <td><input type="number" class="p" value="0" /></td>
                    <td><input type="number" class="total" value="0" disabled /></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">TOTAL</td>
                    <td id="totalkk">531</td>
                    <td id="totall">893</td>
                    <td id="totalp">885</td>
                    <td id="totalkeseluruhan">1778</td>
                </tr>
        </table>
        <div id="chartContainer">
            <canvas id="myPieChart" width="400" height="400"></canvas>
        </div>
    </div>
    <button id="saveBtn">Save</button>
    <button id="editBtn">Edit</button>
    <div id="saveNotification">Data berhasil disimpan!</div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();
            const hour = now.getHours().toString().padStart(2, '0');
            const minute = now.getMinutes().toString().padStart(2, '0');
            const second = now.getSeconds().toString().padStart(2, '0');

            const daysOfWeek = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const dayOfWeek = daysOfWeek[now.getDay()];

            const formattedDate = ` ${dayOfWeek}, ${day}-${month}-${year} ${hour}:${minute}:${second}`;
            
            document.getElementById('datetime').innerText = formattedDate;
        }

        // Fungsi untuk menghitung total L + P untuk setiap baris
        function updateTotal(row) {
            const kk = row.querySelector(".kk");
            const l = row.querySelector(".l");
            const p = row.querySelector(".p");
            const total = row.querySelector(".total");

            total.value = (parseInt(l.value) || 0) + (parseInt(p.value) || 0); // Total L + P
        }

        function updateFooterTotals() {
            let totalKK = 0, totalL = 0, totalP = 0, totalKeseluruhan = 0;
            
            document.querySelectorAll("#agamaTable tbody tr").forEach(row => {
                const kk = parseInt(row.querySelector(".kk").value) || 0;
                const l = parseInt(row.querySelector(".l").value) || 0;
                const p = parseInt(row.querySelector(".p").value) || 0;
                const total = parseInt(row.querySelector(".total").value) || 0;

                totalKK += kk;
                totalL += l;
                totalP += p;
                totalKeseluruhan += total;
            });

            document.getElementById("totalkk").textContent = totalKK;
            document.getElementById("totall").textContent = totalL;
            document.getElementById("totalp").textContent = totalP;
            document.getElementById("totalkeseluruhan").textContent = totalKeseluruhan;
        }

        document.querySelectorAll(".l, .p, .kk").forEach(input => {
            input.addEventListener("input", function() {
                const row = input.closest("tr");
                updateTotal(row);
                updateFooterTotals();
                updatePieChart();
            });
        });

        let isEditMode = false;  // Menandakan apakah mode edit aktif atau tidak

        // Fungsi untuk mengaktifkan atau menonaktifkan mode edit
        function toggleEditMode(enable) {
            const inputs = document.querySelectorAll('input[type="number"]:not(.total)'); // Kecuali total yang selalu disabled
            inputs.forEach(input => {
                input.disabled = !enable;  // Mengaktifkan atau menonaktifkan input
            });
            isEditMode = enable;
        }

        // Event listener untuk tombol Edit
        document.getElementById("editBtn").addEventListener("click", function() {
            const password = prompt("Masukkan password untuk mengedit data:");
            const correctPassword = "adminbtg123"; // Ganti dengan password yang diinginkan
            if (password === correctPassword) {
                toggleEditMode(true);  // Mengaktifkan mode edit jika password benar
                alert("Mode edit aktif. Anda dapat mengubah data.");
            } else {
                alert("Password salah. Mode edit tidak aktif.");  // Jika password salah
            }
        });

        // Event listener untuk tombol Save
        document.getElementById("saveBtn").addEventListener("click", function() {
                const rows = document.querySelectorAll("tbody tr");

                rows.forEach((row, rowIndex) => {
                    const kk = row.querySelector(".kk");
                    const l = row.querySelector(".l");
                    const p = row.querySelector(".p");

                    localStorage.setItem(`agama_kk_${rowIndex}`, kk.value);
                    localStorage.setItem(`agama_l_${rowIndex}`, l.value);
                    localStorage.setItem(`agama_p_${rowIndex}`, p.value);
                });

                const saveNotification = document.getElementById("saveNotification");
                saveNotification.style.display = "block";
                setTimeout(() => saveNotification.style.display = "none", 3000);
                toggleEditMode(false); // Nonaktifkan edit setelah save
        });

        window.onload = function() {
            updateDateTime(); // Initial call to show the date and time
            setInterval(updateDateTime, 1000); // Update time every second

            const rows = document.querySelectorAll("tbody tr");
            rows.forEach((row, rowIndex) => {
                const kk = row.querySelector(".kk");
                const l = row.querySelector(".l");
                const p = row.querySelector(".p");

                kk.value = localStorage.getItem(`agama_kk_${rowIndex}`) || kk.value;
                l.value = localStorage.getItem(`agama_l_${rowIndex}`) || l.value;
                p.value = localStorage.getItem(`agama_p_${rowIndex}`) || p.value;
                updateTotal(row);
            });
            updateFooterTotals();
            updatePieChart();
            toggleEditMode(false); // Default: edit disabled
        };

        function updatePieChart() {
            const labels = [];
            const data = [];

            document.querySelectorAll("#agamaTable tbody tr").forEach(row => {
                const agama = row.querySelector("td:nth-child(2)").textContent;
                const total = parseInt(row.querySelector(".total").value) || 0;

                if (total > 0) {
                    labels.push(agama);
                    data.push(total);
                }
            });

            const ctx = document.getElementById("myPieChart").getContext("2d");
            if (window.pieChart) {
                window.pieChart.destroy();
            }
            window.pieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Penduduk Berdasarkan Agama',
                        data: data,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4CAF50', '#FFC107', '#9C27B0']
                    }]
                },
        options: {
            responsive: true,
            plugins: {
                // Plugin untuk menampilkan label di dalam pie chart
                tooltip: {
                    callbacks: {
                        label: function(tooltipItem) {
                            const label = tooltipItem.label;
                            const value = tooltipItem.raw;
                            return `${label}: ${value}`;
                        }
                    }
                },
                datalabels: {
                    color: '#fff', // Warna teks di dalam diagram
                    formatter: (value, ctx) => {
                        const percentage = (value / data.reduce((a, b) => a + b, 0)) * 100;
                        const label = labels[ctx.dataIndex];
                        return `${label} ${Math.round(percentage)}%`; // Format label untuk setiap irisan
                    },
                    font: {
                        weight: 'bold',
                        size: 14
                    }
                }
            }
                }
            });
        }
    </script>
</body>
</html>
